services:
  osrm:
    image: osrm/osrm-backend:latest
    container_name: tms2-osrm
    command: osrm-routed --algorithm mld /data/russia-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data:ro
    healthcheck:
      test:
        ["CMD-SHELL", "test -r /data/russia-latest.osrm"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
