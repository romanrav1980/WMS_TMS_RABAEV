<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Недостача складской тары</title><link rel="stylesheet" href="styles.css"><style>.tl-case{border:1px solid #e3e9f2;border-left:4px solid #d9a63c;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fffdf7}.tl-case-done{border-left-color:#3aa36b;background:#f8fdf9}.tl-case-focus{box-shadow:0 0 0 3px #8fb5f5}.tl-case-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.tl-chip{border:1px solid #d9a63c;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:650}.tl-case-done .tl-chip{border-color:#3aa36b}.tl-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 12px;margin:8px 0}.tl-facts dt{font-size:11px;color:#7a8aa1}.tl-facts dd{margin:1px 0 0;font-weight:600;overflow-wrap:anywhere}.tl-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tl-why{color:#8a6516}.tl-note{color:#6c7f9b;font-size:12.5px}#tlDecisionHint:not(:empty){background:#f2f7ff;border:1px solid #dce8fb;border-radius:8px;padding:8px 10px}.tl-case button:focus-visible{outline:3px solid #8fb5f5;outline-offset:2px}@media(max-width:1279px){body.tl-page{min-width:0}}@media(max-width:760px){.tl-page .app{display:block}.tl-page .sidebar{position:static;width:auto;height:auto}.tl-page .workspace{padding:16px;min-width:0;max-width:100%;box-sizing:border-box}.tl-page .panel{min-width:0;max-width:100%;box-sizing:border-box}.tl-page select,.tl-page input{max-width:100%}}</style></head><body class="auth-pending tl-page" data-required-permission="wms_admin_login"><div class="app"><aside class="sidebar"><div class="brand">WMS</div><nav class="nav" data-admin-nav data-active-nav="tare-loss"></nav></aside><main class="workspace"><h1>Недостача складской тары</h1><section class="panel"><button id="tlCatalog">Показать склады</button><label>Склад<select id="tlWare"></select></label><button id="tlLoad">Обновить баланс и заявления</button><p id="tlMessage" role="status"></p><div id="tlRows"></div><h2>Заявления о недостаче</h2><div id="tlCases"></div></section><section class="panel" data-permission="tare_loss_report"><h2>Заявление о недостаче</h2><label>Тара на складе<select id="tlBalance"></select></label><label>Не обнаружено единиц<input id="tlQty" inputmode="numeric"></label><label>Обстоятельства<input id="tlReason" maxlength="500"></label><label>Номер акта<input id="tlReference" maxlength="60"></label><button id="tlReport">Зарегистрировать недостачу</button><p>Заявленное количество исключается из свободной тары. Физический баланс сохраняется до независимого решения.</p></section><section class="panel" id="tlDecideForm" data-permission="tare_writeoff"><h2>Независимое решение</h2><label>Заявление<select id="tlClaim"></select></label><label>Результат<select id="tlOutcome"><option value="WRITE_OFF">Подтвердить потерю и списать</option><option value="REJECT">Недостача не подтверждена, освободить тару</option></select></label><label>Основание решения<input id="tlDecisionReason" maxlength="500"></label><label>Номер решения<input id="tlDecisionReference" maxlength="60"></label><p id="tlDecisionHint" aria-live="polite"></p><button id="tlDecide">Провести решение</button><p>Решение оформляет другой сотрудник. Исходный акт и история сохраняются.</p></section><button id="tlRetry" hidden>Повторить сохранённую операцию</button><button id="tlRestart" hidden>Исправить подтверждённый отказ</button></main></div><script src="admin-nav.js"></script><script src="admin-auth.js"></script><script src="tare-loss-cases.js"></script><script src="tare-loss.js"></script></body></html>
