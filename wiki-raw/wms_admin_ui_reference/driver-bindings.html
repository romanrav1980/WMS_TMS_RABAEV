<body class="auth-pending" data-required-permission="warehouse_settings_edit"><div class="app"><aside class="sidebar"><div class="brand">WMS</div><nav class="nav" data-admin-nav data-active-nav="driver-bindings"></nav></aside><main class="workspace"><header class="topbar"><h1>Учётная запись водителя</h1></header><section class="panel">
