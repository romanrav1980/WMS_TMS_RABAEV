<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тара возвращённой погрузки</title><link rel="stylesheet" href="styles.css"></head><body class="auth-pending" data-required-permission="wms_admin_login"><div class="app"><aside class="sidebar"><div class="brand">WMS</div><nav class="nav" data-admin-nav data-active-nav="tare-load-recovery"></nav></aside><main class="workspace"><header class="topbar"><h1>Тара возвращённой погрузки</h1></header><section class="panel" data-permission="tare_view"><label>Исходная погрузка<input id="recoveryLoad" maxlength="100" autocomplete="off"></label><button id="recoveryRefresh">Показать подтверждённые возвраты</button><p>Возврат из машины подтверждают водитель и склад в разделе «Оборотная тара». Здесь возвращённая тара закрепляется за прежним физическим местом. Выгрузку товара подтвердите на странице погрузки.</p><div id="recoveryRows"></div></section><section class="panel" data-permission="tare_plan"><label>Возвращённое место<select id="recoverySource"></select></label><label>Идентификатор паллеты<input id="recoveryScan" autocomplete="off" maxlength="200" title="Отсканируйте исходное физическое место, вернувшееся из машины."></label><button id="recoveryConfirm">Закрепить возвращённую тару</button><button id="recoveryRetry" hidden>Повторить сохранённое закрепление</button><button id="recoveryRestart" hidden>Исправить данные после отказа</button></section><p id="recoveryStatus" role="status"></p></main></div><script src="admin-nav.js"></script><script src="admin-auth.js"></script><script src="tare-load-recovery.js"></script></body></html>
