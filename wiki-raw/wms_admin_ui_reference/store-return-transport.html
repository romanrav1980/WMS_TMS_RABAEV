<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вывоз возвратов</title><link rel="stylesheet" href="styles.css"></head>
<body class="auth-pending" data-required-permission="store_return_transport"><div class="app"><aside class="sidebar"><div class="brand">WMS</div><nav class="nav" data-admin-nav data-active-nav="store-return-transport"></nav></aside><main class="workspace"><header class="topbar"><h1>Вывоз согласованных возвратов</h1></header>
<section class="panel"><button id="transportEligible">Обновить возвраты с SAP-основанием</button><label>Согласованный возврат<select id="transportApproval"></select></label><label>Существующий рейс<input id="transportTrip" inputmode="numeric"></label><label>Масса брутто возврата, кг<input id="transportMass" inputmode="decimal"></label><label>Физические машиноместа<input id="transportPlaces" inputmode="numeric"></label><button id="transportPlan">Включить вывоз в рейс</button><button id="transportShow">Показать возвраты рейса</button><p id="transportMessage" role="status"></p><div id="transportRows"></div>
<p>Учитываются все исходящие места и все возвраты: подтверждение доставки само по себе не уменьшает занимаемую вместимость. Вложенные коробки не увеличивают машиноместа. План вывоза не подтверждает фактический забор или приёмку склада.</p></section>
<button id="transportRetry" hidden>Повторить сохранённый план</button><button id="transportRestart" hidden>Исправить после подтверждённого отказа</button></main></div><script src="admin-nav.js"></script><script src="admin-auth.js"></script><script src="store-return-transport.js"></script></body></html>
