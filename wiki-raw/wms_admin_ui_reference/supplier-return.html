<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Возврат поставщику</title><link rel="stylesheet" href="styles.css"></head><body class="auth-pending" data-required-permission="wms_admin_login"><div class="app"><aside class="sidebar"><div class="brand">WMS</div><nav class="nav" data-admin-nav data-active-nav="supplier-return"></nav></aside><main class="workspace"><h1>Возврат поставщику</h1><section class="panel"><label>Склад<input id="srWare" inputmode="numeric"></label><button id="srLoad">Обновить возвраты</button><p id="srMessage" role="status"></p><div id="srRows"></div></section><section class="panel" data-permission="store_return_approve"><h2>Подготовить СТ</h2><label>Размещённый возврат<select id="srReceipt"></select></label><button id="srSuppliers">Загрузить поставщиков</button><label>Поставщик<select id="srSupplier"></select></label><label>Основание<input id="srReason" maxlength="500"></label><label>Номер решения<input id="srReference" maxlength="60"></label><button id="srPrepare">Создать возвратную СТ</button><p>После подготовки назначьте СТ на рейс и выполните фактическую погрузку в существующем транспортном рабочем месте. Подготовка сохраняет остаток; погрузка списывает его один раз. Получение поставщиком подтверждается отдельно.</p></section><button id="srRetry" hidden>Повторить сохранённую операцию</button><button id="srRestart" hidden>Исправить подтверждённый отказ</button></main></div><script src="admin-nav.js"></script><script src="admin-auth.js"></script><script src="supplier-return.js"></script><script src="return-workspace-link.js"></script></body></html>
