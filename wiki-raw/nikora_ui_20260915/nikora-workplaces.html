function heading(title,sub){return '<div class="nk-heading"><div><h1>'+title+'</h1><p class="nk-subtitle">'+sub+'</p></div><div class="nk-switch" aria-label="Представление"><button data-view="a" aria-pressed="'+(state.view==='a')+'">А · '+(isMobile()?'ТСД':'Таблица')+'</button><button data-view="b" aria-pressed="'+(state.view==='b')+'">Б · '+(isMobile()?'Пост':'Доска')+'</button></div></div>';}
function isMobile(){return ['reachtruck','picker','quality','weight','loader','receipt'].includes(state.role);}
function details(d){const row=d.rows[state.selected];const fields=state.selected===0?d.detail:[d.heads[1],row[1],d.heads[2],row[2],d.heads[3],row[3],'Контекст','Выбранная запись · демо'];return '<section class="nk-panel nk-details"><h2>'+row[0]+'</h2><dl>'+fields.map((v,i)=>i%2?'<dd>'+v+'</dd>':'<dt>'+v+'</dt>').join('')+'</dl><button class="nk-main-action" data-preview>'+d.action+'</button>'+(state.role==='reachdispatch'?'<button data-priority '+([0,2].includes(state.selected)?'disabled':'')+'>Поднять в очереди</button><p class="nk-hint">Причина и последствия — перед подтверждением</p>':'')+'</section>';}
function desktop(){
const d=data[state.role];const laneMap={integration:[0,1,1,1,2],master:[0,1,0,0],warehouse:[0,1,2,0],crossdock:[1,1,0,2],consolidation:[0,1,2],returns:[0,1,2],exceptions:[1,0,0]};let list='';
if(state.view==='a'){list='<section class="nk-panel"><div class="nk-panel-title"><h2>Рабочая очередь</h2><span class="nk-note">'+d.rows.length+' записи</span></div><div class="nk-scroll"><table><thead><tr>'+d.heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+d.rows.map((r,i)=>'<tr class="'+(i===state.selected?'nk-selected':'')+'">'+r.map((v,j)=>'<td>'+(j===0?'<button class="nk-row-button" data-row="'+i+'">'+v+'</button>':v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>';}
else if(state.role==='transport'){list='<section class="nk-panel"><div class="nk-panel-title"><h2>Порядок остановок · не карта</h2></div><div class="nk-timeline">'+[['06:30','Склад-источник','Погрузка · 820 кг'],['07:10','Cross-dock · ворота 2','Выгрузка → контроль → консолидация'],['08:00','Cross-dock · ворота 4','Основной рейс · конфликт секции'],['09:00','Магазин · Глинки, 12','Окно 09:00–10:00']].map(r=>'<div class="nk-stop"><time>'+r[0]+'</time><div><strong>'+r[1]+'</strong><p class="nk-note">'+r[2]+'</p></div></div>').join('')+'</div></section>';}
else{list='<section class="nk-board">'+d.lanes.map((l,j)=>'<div class="nk-lane"><h2>'+l+'</h2>'+d.rows.map((r,i)=>(laneMap[state.role]?.[i]??i%3)===j?'<article class="nk-ticket"><button data-row="'+i+'">'+r[0]+'</button><p>'+r[1]+'</p><p>'+r[2]+'</p><p>'+r[3]+'</p></article>':'').join('')+'</div>').join('')+'</section>';}
outlet.innerHTML=heading(d.title,d.sub)+'<div class="nk-strip">'+d.metrics.map(m=>{const p=m.split('|');return '<span><strong>'+p[0]+'</strong>'+p[1]+'</span>';}).join('')+'</div><div class="nk-split">'+list+details(d)+'</div><div class="nk-alert">'+d.notice+'</div>';
}
function scanForm(label,hint){return '<form id="nk-scan-form"><label>'+label+'<input id="nk-scan" autocomplete="off" placeholder="Сканируйте код" aria-label="'+label+'"></label><p class="nk-hint">'+hint+'</p><button class="nk-main-action" type="submit">Сканировать</button></form>';}
function mobile(){
let body='',aside='',title=roles[state.role],sub='Один активный шаг · ошибки остаются на этом экране';
if(state.role==='reachtruck'){
const names=['Сканируйте источник','Сканируйте паллету','Подтвердите взятие','Поставьте в назначение','Задание завершено'];
body='<section><p class="nk-kicker">Перемещение · RT-01 · TASK-1842</p><div class="nk-big">'+names[Math.min(state.step,4)]+'</div><div class="nk-route"><div><span class="nk-kicker">ОТКУДА</span><strong>A-03-02</strong></div><div><span class="nk-kicker">КУДА</span><strong>CD-02</strong></div></div><p>Идентификатор паллеты <strong>PLT-104</strong></p><p class="nk-hint">24 короба · источник → линия cross-dock</p></section><section><div class="nk-stepbar">'+[0,1,2,3].map(i=>'<span class="'+(i<state.step?'nk-done':'')+'"></span>').join('')+'</div>'+(state.step===2?'<button class="nk-main-action" data-taken>Взял · груз на технике</button><p class="nk-hint">Подтвердить после фактического безопасного взятия.</p>':state.step===4?'<p class="nk-ok">Сервер подтвердил завершение</p><p class="nk-hint">В демонстрации очередь пуста. В продукте следующее задание появится здесь автоматически.</p><button data-reset>Повторить демонстрацию</button>':scanForm('Активный скан',state.step===0?'Пример: A-03-02':state.step===1?'Пример: PLT-104':'После установки: CD-02'))+'<div class="nk-secondary"><button data-problem>Проблема</button><button data-detail>Детали</button></div></section>';
aside='<h2>Без лишних переходов</h2><p>Источник → паллета → взял → назначение. Скан автоматически меняет активный шаг.</p><p>Неверный код не открывает другое окно и не продвигает задание.</p><p>Вариант Б — две крупные зоны для бортового терминала.</p>';
}else if(state.role==='picker'){
const names=['Ячейка отбора','Товар / партия','Целевой короб','Подтвердить количество'];
body='<section><p class="nk-kicker">Задание PK-817 · магазин 024</p><div class="nk-big">'+names[Math.min(state.step,3)]+'</div><div class="nk-route"><div><span>Откуда</span><strong>A-01-04</strong></div><div><span>Куда</span><strong>BOX-17</strong></div></div><h2>Молоко 1 л · SKU-001</h2><p>Партия B-15 · к отбору 6 шт.</p></section><section>'+(state.step<3?scanForm('Скан текущего шага','Пример: '+['A-01-04','SKU-001','BOX-17'][state.step]):'<label>Фактически, шт.<input id="nk-qty" type="number" min="0" max="6" value="6"></label><button class="nk-main-action" data-picked>Завершить отбор</button>')+'<div class="nk-secondary"><button data-problem>Недостача</button><button data-detail>Детали</button></div></section>';
aside='<h2>Скан вместо меню</h2><p>Один отбор. Проверка ячейки, товара и назначения.</p><p>Закрытие сборки не заменяет независимый контроль.</p>';
}else if(state.role==='quality'){
const pass=state.step===0?1:2;const arr=pass===1?state.p1:state.p2;
body='<section><p class="nk-kicker">HU-104 · состав v4 · магазин 024</p><div class="nk-big">'+(state.step<2?'Проход '+pass:'Сравнение')+'</div><div class="nk-stepbar"><span class="nk-done"></span><span class="'+(state.step>0?'nk-done':'')+'"></span></div>'+(state.step<2?'<p>Сканов в этом проходе: <strong>'+arr.length+'</strong></p><p class="nk-hint">План и результат другого прохода скрыты.</p>':'<p>Проход 1: '+state.p1.length+' · Проход 2: '+state.p2.length+'</p><p class="'+(qualityOK()?'nk-ok':'nk-bad')+'">'+(qualityOK()?'Состав совпал · далее осмотр':'HOLD · расхождение состава')+'</p>')+'</section><section>'+(state.step<2?scanForm('Товар текущего прохода','Демо: SKU-001, каждый скан — физическая единица.')+'<button data-close-pass style="margin-top:12px;width:100%">Завершить проход '+pass+'</button>':'<button class="nk-main-action" data-inspection '+(!qualityOK()?'disabled':'')+'>Осмотр: упаковка цела</button><button data-reset style="margin-top:10px">Новая демо-сессия</button>')+'</section>';
aside='<h2>Два независимых пересчёта</h2><p>Для успешного примера отсканируйте SKU-001 два раза в каждом проходе. Разное количество даст HOLD.</p><p>Второй проход начинается пустым. Сравнение открывается только после завершения.</p>';
}else if(state.role==='weight'){
body='<section><p class="nk-kicker">HU-104 · состав v4 · весы WS-02</p><div class="nk-big">Весовой контроль</div><p class="nk-ok">● Стабильно · демонстрационный прибор</p><div class="nk-weight" id="nk-net">12,060 кг</div><p>Нетто · ожидается 12,000 кг</p><p class="nk-hint">Допуск ±0,150 кг · правило DEMO-v1</p></section><section><label>Брутто, кг<input id="nk-gross" inputmode="decimal" value="12,860"></label><label>Тара, кг<input id="nk-tare" inputmode="decimal" value="0,800"></label><button class="nk-main-action" data-weigh>Проверить вес</button><div class="nk-secondary"><button data-bad-weight>Вес за допуском</button><button data-no-weight>Нет связи</button></div><p class="nk-hint">В продукте масса приходит от весов; ручной ввод — отдельное право.</p></section>';
aside='<h2>Допуск привязан к составу</h2><p>Gross − tare = net. Недостоверное измерение не даёт разрешения отгрузки.</p><p>Числа иллюстративные, не производственные нормативы.</p>';
}else if(state.role==='loader'){
body='<section><p class="nk-kicker">TR-041 · LEG-1 · ворота 2</p><div class="nk-big">'+(state.step===0?'Погрузить HU':state.step===1?'Груз погружен':'Выезд подтверждён')+'</div><div class="nk-route"><div><span>Позиция</span><strong>1 / 1</strong></div><div><span>Секция</span><strong>Сухая</strong></div></div><h2>HU-104 · магазин 024</h2></section><section>'+(state.step===0?scanForm('Идентификатор HU','Демо: HU-104; ворота уже подтверждены'):state.step===1?'<p class="nk-warn">LOADED ≠ «В пути»</p><button class="nk-main-action" data-depart>Подтвердить фактический выезд</button><p class="nk-hint">Только уполномоченный оператор после физического выезда.</p>':'<p class="nk-ok">DEPARTED · ERP ORDER_IN_TRANSIT в outbox</p><button data-reset>Повторить демонстрацию</button>')+'<div class="nk-secondary"><button data-problem>Расхождение</button></div></section>';
aside='<h2>Два разных факта</h2><p>Погрузили и выехали — отдельные события одного плеча.</p><p>Складская приёмка не закрывает приёмку магазина.</p>';
}else{
body='<section><p class="nk-kicker">Магазин 024 · ул. Глинки, 12</p><div class="nk-big">Приёмка поставки</div><p class="nk-subtitle">TR-081 · HU-104 · ожидается 12 шт.</p></section><section><label>Принято, шт.<input id="nk-received" type="number" min="0" max="12" value="12"></label><label>Причина расхождения<select id="nk-reason"><option value="">Без расхождения</option><option>Недостача</option><option>Повреждение</option><option>Отказ</option></select></label><button class="nk-main-action" data-receive>Подтвердить приёмку</button><p class="nk-hint">В макете HU уже отсканирован. В продукте обязательна проверка магазина и идентификатора.</p></section>';
aside='<h2>Принято — значит подтверждено</h2><p>Частичная приёмка сохраняет расхождение. ERP получает фактическое количество.</p><p>Offline-черновик не становится фактом доставки.</p>';
}
outlet.innerHTML=heading(title,sub)+'<div class="nk-mobile-wrap"><article class="nk-device '+(state.view==='b'?'nk-wide-device':'')+'"><header class="nk-device-header"><span>NIKORA · '+(state.role==='reachtruck'?'RT-01':'ТСД')+'</span><span>Онлайн · ДЕМО</span></header><div class="nk-device-content">'+body+'</div></article></div>';
}
function qualityOK(){return state.p1.length===2&&state.p2.length===2&&state.p1.every(s=>s==='SKU-001')&&state.p2.every(s=>s==='SKU-001');}
function render(){root.classList.toggle('nk-compact',state.compact);root.querySelector('#nk-role').value=state.role;root.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===state.role));isMobile()?mobile():desktop();feedback.textContent=state.message;}
function changeRole(r){state.role=r;state.selected=0;state.step=0;state.p1=[];state.p2=[];state.message='';render();}
root.querySelector('#nk-role').addEventListener('change',e=>changeRole(e.target.value));
root.addEventListener('submit',e=>{if(e.target.id!=='nk-scan-form')return;e.preventDefault();const value=root.querySelector('#nk-scan').value.trim().toUpperCase();let expected='';
if(state.role==='reachtruck')expected=state.step===0?'A-03-02':state.step===1?'PLT-104':'CD-02';
if(state.role==='picker')expected=['A-01-04','SKU-001','BOX-17'][state.step];
if(state.role==='loader')expected='HU-104';
if(state.role==='quality'){if(!/^SKU-[0-9]{3}$/.test(value)){say('Не распознан товар. Для примера используйте SKU-001.');return;}(state.step===0?state.p1:state.p2).push(value);state.message='Скан зарегистрирован в текущем проходе.';render();}
else if(value!==expected){say('Ошибка: ожидался '+expected+'. Шаг не изменён.');}
else{state.step++;state.message='Демо-подтверждение принято. '+(state.role==='reachtruck'&&state.step===4?'Перемещение завершено.':'');render();}
root.querySelector('#nk-scan')?.focus();
});
root.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
if(b.dataset.role){changeRole(b.dataset.role);return;}
if(b.dataset.view){state.view=b.dataset.view;render();return;}
if(b.hasAttribute('data-row')){state.selected=Number(b.dataset.row);render();say('Выбрано: '+data[state.role].rows[state.selected][0]+'.');return;}
if(b.hasAttribute('data-reset')){state.step=0;state.p1=[];state.p2=[];state.message='';render();return;}
if(b.hasAttribute('data-taken')){state.step=3;state.message='Груз на технике. Назначение CD-02 сохранено.';render();return;}
if(b.hasAttribute('data-close-pass')){const arr=state.step===0?state.p1:state.p2;if(!arr.length){say('Проход пуст. Отсканируйте физический товар.');return;}state.step++;state.message=state.step===1?'Начат независимый второй проход.':qualityOK()?'Состав совпал. Осмотр и вес ещё обязательны.':'HOLD: расхождение, погрузка запрещена.';render();return;}
if(b.hasAttribute('data-inspection')){changeRole('weight');say('Осмотр в демо подтверждён. Осталось стабильное измерение массы.');return;}
if(b.hasAttribute('data-bad-weight'))root.querySelector('#nk-gross').value='13,400';
if(b.hasAttribute('data-no-weight')){root.querySelector('#nk-net').textContent='Нет измерения';root.querySelector('[data-weigh]').disabled=true;root.querySelector('[data-bad-weight]').disabled=true;say('HOLD: нет связи с весами. Разрешение отгрузки не получено.');return;}
if(b.hasAttribute('data-weigh')||b.hasAttribute('data-bad-weight')){const g=Number(root.querySelector('#nk-gross').value.replace(',','.'));const t=Number(root.querySelector('#nk-tare').value.replace(',','.'));if(!Number.isFinite(g)||!Number.isFinite(t)||t<0||g<t){say('Ошибка массы/тары. Измерение не принято.');return;}const n=g-t;root.querySelector('#nk-net').textContent=n.toFixed(3).replace('.',',')+' кг';say(Math.abs(n-12)<=.1500001?'Демо: вес в допуске. Полный допуск требует действующих двух проходов и осмотра.':'HOLD: масса за допуском. Погрузка запрещена.');return;}
if(b.hasAttribute('data-depart')){state.step=2;state.message='Демо: событие выезда зафиксировано; доставка магазину ещё не подтверждена.';render();return;}
if(b.hasAttribute('data-picked')){const q=Number(root.querySelector('#nk-qty').value);say(q===6?'Демо: отбор закрыт. Ожидается независимый контроль.':'Недосбор: выберите причину через «Недостача». Факт не закрыт.');return;}
if(b.hasAttribute('data-receive')){const q=Number(root.querySelector('#nk-received').value);const reason=root.querySelector('#nk-reason').value;if(!Number.isInteger(q)||q<0||q>12){say('Допустимо от 0 до 12 целых шт.');return;}if(q<12&&!reason){say('Для частичной приёмки нужна причина.');return;}say('Демо: принято '+q+' из 12. '+(q<12?'Расхождение '+(12-q)+' шт. сохранено. ':'')+'ERP-событие подготовлено, ACK отдельно.');return;}
if(b.hasAttribute('data-problem')){say('Проблема: нет паллеты / занята ячейка / повреждение / проезд закрыт. В продукте — короткая панель выбора причины, без выхода из задания.');return;}
if(b.hasAttribute('data-detail')){say('Задание связано с магазином 024, исходной частью PART-1 и текущей версией состава. Изменение цели — только через серверную проверку.');return;}
if(b.hasAttribute('data-priority')){say('Предложение: '+data.reachdispatch.rows[state.selected][0]+' станет следующим после текущего груза. Причина: риск срока подачи. В продукте потребуется confirm новой версии очереди; физическое задание 1842 не прерывается.');return;}
if(b.hasAttribute('data-preview')){const msgs={reachdispatch:'Задание 1842 уже выполняется — не переносится. Очередь 1843/1845 можно изменить после проверки дедлайнов и причины; занятая цель 1844 остаётся блокером.',integration:'Повтор бизнес-применения запрещён: сначала исправить зависимость. Технический повтор использует неизменный messageId.',master:'Preview: изменятся будущие версии и 2 ожидающих заказа. Исполненные snapshots останутся прежними.',warehouse:'Предложение: пополнение A-01-04. В продукте назначение подтвердит проверка ресурса и версии.',crossdock:'Preview: HU-104 + HU-106 → новый HU. HU-106 ещё в пути — физическое объединение заблокировано.',transport:'План не допущен: fresh в сухой секции. Измените секцию/ТС, затем повторите проверку.',consolidation:'Выпуск заблокирован: отсутствует fresh-часть и один ACK. Автоматический режим не обходит блокировку.',returns:'Preview возврата CAGE-0041: custody магазин → рейс → разрешённая площадка; ожидается физическое подтверждение.',exceptions:'Допустимо направить HU на повторный контроль/карантин. Нельзя вручную подменить весовой факт.'};say(msgs[state.role]);}
});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'compact',{label:'Плотная таблица'});}
})();
</script>
